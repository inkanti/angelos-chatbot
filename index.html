<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angelos - Fresas con Crema y Minidonas 🍓🍩</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff2d78 0%, #ff6b9d 50%, #ffa8c9 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    /* Header de la marca - estilo página web */
    .brand-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .brand-header .logo {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: white;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
      letter-spacing: -1px;
    }

    .brand-header .logo span {
      display: inline-block;
      background: white;
      color: #ff2d78;
      padding: 0 12px;
      border-radius: 20px;
      margin-left: 5px;
      font-size: 1.5rem;
      vertical-align: middle;
    }

    .brand-header p {
      font-size: 1rem;
      color: white;
      opacity: 0.95;
      margin-top: 5px;
      font-weight: 300;
    }

    /* Chat Container - estilo tarjeta moderna */
    .chat-container {
      background: white;
      border-radius: 30px;
      box-shadow: 0 25px 60px rgba(255, 45, 120, 0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 650px;
    }

    .chat-header {
      background: linear-gradient(135deg, #ff2d78, #ff6b9d);
      color: white;
      padding: 25px 20px;
      text-align: center;
      position: relative;
    }

    .chat-header .avatar {
      width: 70px;
      height: 70px;
      background: white;
      border-radius: 50%;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      border: 4px solid rgba(255,255,255,0.3);
    }

    .chat-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      margin-bottom: 6px;
    }

    .chat-header .status {
      font-size: 0.85rem;
      opacity: 0.9;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 300;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background: #7fff00;
      border-radius: 50%;
      animation: pulse 2s infinite;
      box-shadow: 0 0 10px #7fff00;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.2); }
    }

    /* Botón de página web - NUEVO */
    .web-button {
      display: block;
      margin: 12px 20px;
      padding: 14px 20px;
      background: linear-gradient(135deg, #ff2d78, #ff6b9d);
      color: white;
      text-decoration: none;
      border-radius: 25px;
      text-align: center;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 0 4px 15px rgba(255, 45, 120, 0.3);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .web-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 45, 120, 0.4);
    }

    .web-button svg {
      width: 20px;
      height: 20px;
    }

    /* Quick Buttons - CENTRADOS */
    .quick-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 15px 20px;
      background: #fff0f5;
      border-bottom: 1px solid #ffd6e7;
      justify-content: center;
      align-items: center;
    }

    .quick-btn {
      padding: 10px 18px;
      border: 2px solid #ff2d78;
      background: white;
      color: #ff2d78;
      border-radius: 25px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
    }

    .quick-btn:hover {
      background: #ff2d78;
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(255, 45, 120, 0.3);
    }

    /* Messages Area */
    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 88%;
      padding: 14px 18px;
      border-radius: 22px;
      font-size: 0.9rem;
      line-height: 1.6;
      animation: aparecer 0.4s ease;
      word-wrap: break-word;
      font-family: 'Poppins', sans-serif;
    }

    @keyframes aparecer {
      from { 
        opacity: 0; 
        transform: translateY(15px) scale(0.95); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0) scale(1); 
      }
    }

    .message.bot {
      background: white;
      color: #333;
      align-self: flex-start;
      border-bottom-left-radius: 8px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
      border: 1px solid #f0f0f0;
    }

    .message.user {
      background: linear-gradient(135deg, #ff2d78, #ff6b9d);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 8px;
      box-shadow: 0 5px 20px rgba(255, 45, 120, 0.3);
    }

    .message-time {
      font-size: 0.7rem;
      opacity: 0.5;
      margin-top: 8px;
      display: block;
      font-weight: 300;
    }

    /* Typing Indicator */
    .typing {
      display: flex;
      gap: 5px;
      padding: 18px 22px;
      align-self: flex-start;
      background: white;
      border-radius: 22px;
      border-bottom-left-radius: 8px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
      width: fit-content;
      border: 1px solid #f0f0f0;
    }

    .typing span {
      width: 10px;
      height: 10px;
      background: #ff2d78;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }

    .typing span:nth-child(1) { animation-delay: 0s; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Input Area */
    .chat-input {
      padding: 18px 20px;
      background: white;
      border-top: 1px solid #f0f0f0;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .chat-input input {
      flex: 1;
      padding: 14px 22px;
      border: 2px solid #f0f0f0;
      border-radius: 30px;
      outline: none;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
    }

    .chat-input input:focus {
      border-color: #ff2d78;
      box-shadow: 0 0 0 4px rgba(255, 45, 120, 0.1);
    }

    .chat-input input::placeholder {
      color: #ccc;
    }

    .send-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #ff2d78, #ff6b9d);
      color: white;
      cursor: pointer;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 45, 120, 0.3);
    }

    .send-btn:hover {
      transform: scale(1.1) rotate(-5deg);
      box-shadow: 0 6px 20px rgba(255, 45, 120, 0.4);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    /* Scrollbar styling */
    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: #ffd6e7;
      border-radius: 3px;
    }

    .chat-messages::-webkit-scrollbar-thumb:hover {
      background: #ff2d78;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .chat-container {
        height: 100vh;
        border-radius: 0;
      }
      
      body {
        padding: 0;
      }
      
      .brand-header .logo {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="brand-header">
    <div class="logo">Angelos <span>🍓</span></div>
    <p>Fresas con Crema y Minidonas</p>
  </div>

  <div class="chat-container">
    <div class="chat-header">
      <div class="avatar">🍩</div>
      <h2>Fresi</h2>
      <div class="status">
        <span class="status-dot"></span>
        <span>Tu asistente virtual</span>
      </div>
    </div>

    <!-- BOTÓN DE PÁGINA WEB - NUEVO -->
    <a href="https://tguw4a2gzlr42.kimi.page/" target="_blank" class="web-button">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
      </svg>
      🛒 Hacer pedido en nuestra web
    </a>

    <div class="quick-buttons">
      <button class="quick-btn" onclick="enviarRapido('1')">📋 Productos</button>
      <button class="quick-btn" onclick="enviarRapido('2')">💕 Recomendaciones</button>
      <button class="quick-btn" onclick="enviarRapido('3')">📍 Ubicación</button>
      <button class="quick-btn" onclick="enviarRapido('4')">🚚 Envíos</button>
      <button class="quick-btn" onclick="enviarRapido('5')">🎉 Promos</button>
      <button class="quick-btn" onclick="enviarRapido('6')">📞 Contacto</button>
    </div>

    <div class="chat-messages" id="mensajes">
      <div class="message bot">
        ¡Hola! 🍓🍩 Soy Fresi, tu asistente de Angelos.<br><br>
        ¿En qué puedo ayudarte? Escribe <b>hola</b> o <b>menu</b> para ver las opciones.<br><br>
        O si ya sabes lo que quieres, ¡haz tu pedido directo en nuestra web! 🛒
        <span class="message-time">Ahora</span>
      </div>
    </div>

    <div class="chat-input">
      <input 
        type="text" 
        id="inputMensaje" 
        placeholder="Escribe un número o tu pregunta..." 
        onkeypress="if(event.key==='Enter') enviarMensaje()"
        autocomplete="off"
      >
      <button class="send-btn" onclick="enviarMensaje()">➤</button>
    </div>
  </div>
</div>

<script>
  // PRODUCCIÓN (Render):
  const API_URL = 'https://angelos-chatbot.onrender.com/chat';

  const mensajesDiv = document.getElementById('mensajes');
  const input = document.getElementById('inputMensaje');

  function obtenerHora() {
    const ahora = new Date();
    return ahora.toLocaleTimeString('es-SV', { 
      hour: '2-digit', 
      minute: '2-digit' 
    });
  }

  function agregarMensaje(texto, esBot) {
    const div = document.createElement('div');
    div.className = `message ${esBot ? 'bot' : 'user'}`;
    
    let html = texto.replace(/\n/g, '<br>');
    html += `<span class="message-time">${obtenerHora()}</span>`;
    div.innerHTML = html;
    
    mensajesDiv.appendChild(div);
    mensajesDiv.scrollTop = mensajesDiv.scrollHeight;
  }

  function mostrarTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing-indicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    mensajesDiv.appendChild(div);
    mensajesDiv.scrollTop = mensajesDiv.scrollHeight;
  }

  function ocultarTyping() {
    const typing = document.getElementById('typing-indicator');
    if (typing) typing.remove();
  }

  async function enviarMensaje() {
    const texto = input.value.trim();
    if (!texto) return;

    agregarMensaje(texto, false);
    input.value = '';
    input.focus();
    mostrarTyping();

    try {
      const respuesta = await fetch(API_URL, {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({ mensaje: texto })
      });

      if (!respuesta.ok) {
        throw new Error(`Error HTTP: ${respuesta.status}`);
      }

      const datos = await respuesta.json();
      ocultarTyping();
      agregarMensaje(datos.respuesta, true);
      
      console.log('📊 Respuesta:', {
        tipo: datos.tipo,
        fuente: datos.fuente
      });

    } catch (error) {
      console.error('❌ Error:', error);
      ocultarTyping();
      agregarMensaje(
        '🍓 ¡Ups! Tuve un problemita de conexión. Intenta de nuevo o visita nuestra web: https://tguw4a2gzlr42.kimi.page/',
        true
      );
    }
  }

  function enviarRapido(texto) {
    input.value = texto;
    enviarMensaje();
  }

  setTimeout(() => {
    input.focus();
  }, 500);
</script>

</body>
</html>
